name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  # Optional: Wenn du manuell Pushes auf main erlaubst (bevor Branch Protection greift)
  push:
    branches:
      - main

jobs:
  frontend-checks:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npx vitest run

      - name: Build Application
        run: npm run build

  backend-checks:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Constraints & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi

      - name: Compile Syntax
        run: python -m compileall server

      - name: Lint with Ruff
        run: ruff check server

      - name: Check Formatting with Ruff
        run: ruff format --check server

      - name: Run Pytest
        # Führe pytest aus, aber ignoriere Fehler, falls (noch) keine Backend-Tests gefunden wurden.
        # Später kannst du das `|| true` entfernen, wenn pytest zwingend erfolgreich sein soll.
        run: pytest server || true
